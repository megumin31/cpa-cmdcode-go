name: Refresh model roster

'on':
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_drift:
        description: "Allow reviewed large roster changes"
        type: boolean
        default: false

permissions:
  contents: read

# Every writer shares one lock, including manual runs. The explicit Git lease
# still protects against writers outside Actions and against a changed ref.
concurrency:
  group: models-data
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -trimpath -buildvcs=true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum

      - name: Test extraction and safe snapshot publication
        run: python3 -m unittest discover -s scripts -p 'test_*models.py' -v

      - name: Read previous published snapshot and capture lease
        run: python3 scripts/publish-models.py prepare

      - name: Generate and validate candidate JSON
        env:
          ALLOW_DRIFT: ${{ inputs.allow_large_drift }}
        run: |
          EXTRA=()
          if [ "$ALLOW_DRIFT" = "true" ]; then EXTRA+=(--allow-large-drift); fi
          python3 scripts/extract-models.py --json-only \
            --prev build/model-data/previous.json \
            --out build/model-data/candidate.json "${EXTRA[@]}"

      - name: Validate candidate with the actual runtime parser, offline
        run: |
          go -C go mod download
          go -C go mod verify
          COMMANDCODE_CONFIG_DIR="$(mktemp -d)" \
            COMMANDCODE_KEY= COMMANDCODE_API_KEY= \
            MODELS_CANDIDATE_PATH="$PWD/build/model-data/candidate.json" \
            GOPROXY=off GOSUMDB=off \
            go -C go test -count=1 -run '^TestPublishedModelCandidate$' .
          git diff --exit-code -- go/go.mod go/go.sum data/models.snapshot.json go/models_generated.go

      - name: Publish one parentless snapshot with compare-and-swap
        run: python3 scripts/publish-models.py publish
